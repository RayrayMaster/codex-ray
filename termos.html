<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Termos de Uso - The Spike</title>

<!-- Material Symbols -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

<style>
/* Cabeçalho / ícones (copiado e adaptado) */
body { background: linear-gradient(135deg, #18183a 60%, #400557 100%); color:#e0e0e0; font-family: Arial, sans-serif; margin:0; padding:20px; }
.container { max-width:800px; margin:0 auto; }

.logo { width:110px; height:110px; background:#18183a; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:12px auto; border:4px solid #ffb347; position:relative; }
.logo img { width:96px; height:96px; border-radius:50%; object-fit:cover; border:3px solid #fff; }
.logo-badge { position:absolute; top:-8px; right:-8px; background:#18183a; color:#ffb347; border:2px solid #ffb347; border-radius:10px; padding:2px 6px; font-size:14px; display:inline-flex; align-items:center; justify-content:center; }

.cabecalho {
    text-align:center;
    font-family: Arial, sans-serif;
    margin: 0 auto 24px auto;
    border: 2px solid #ffb347;
    border-radius: 10px;
    padding: 12px 0;
    background: #18183a;
    color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    max-width: 800px;
}
.cabecalho a {
    color: #ffb347;
    text-decoration: none;
    margin: 0 18px;
    font-weight: bold;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.cabecalho a:hover { color:#fff; transform:scale(1.05); }
.material-symbols-outlined { font-size:24px; vertical-align:middle; }

/* manter o ícone do Spotify pequeno e alinhado */
.spotify-icon { width:28px; height:28px; object-fit:contain; border:none; display:inline-block; vertical-align:middle; }

/* área de conteúdo dos termos */
.termos-box { background:#23234a; padding:20px; border-radius:12px; border:2px solid #ffb347; color:#e0e0e0; }
</style>
</head>
<body>
<div class="container">

    <!-- logo (usar mesma aparência das outras páginas) -->
    <div class="logo">
        <img src="https://pbs.twimg.com/media/GJchFroW0AEvTBz.png" alt="Ícone de Clove">
        <span class="logo-badge">★</span>
    </div>

    <!-- cabeçalho replicado -->
    <div class="cabecalho">
        <a href="index.html" title="Home">
            <span class="material-symbols-outlined">home_app_logo</span>
        </a>

        <!-- segundo ícone (privacy_tip conforme solicitado) -->
        <a href="Galeria.html" title="Galeria">
            <span class="material-symbols-outlined">privacy_tip</span>
        </a>

        <a href="music.html" title="Music">
            <span class="material-symbols-outlined">music_note</span>
        </a>

        <a href="curriculo.html" title="Currículo">
            <span class="material-symbols-outlined">work</span>
        </a>

        <a href="canal.html" title="Canal">
            <span class="material-symbols-outlined">play_circle</span>
        </a>

        <a href="https://open.spotify.com" title="Spotify" target="_blank" aria-label="Spotify">
            <img class="spotify-icon" src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg" alt="Spotify" />
        </a>
    </div>

    <!-- Conteúdo dos Termos -->
    <div class="termos-box">
        <h1 style="color:#ffb347; margin-bottom:12px;">Termos de Uso</h1>
        <p style="line-height:1.6;">
            <!-- Substitua pelo conteúdo real dos termos de uso -->
            Aqui vão os termos de uso do site. Adicione o texto completo dos termos ou link para o documento oficial.
        </p>
    </div>

</div>
</body>
</html>
